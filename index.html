<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Nexora Education — School Content & Growth Toolkit</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#08050F;--pn:#171025;--pn2:#1f1633;--pu:#A020F0;--mg:#E100FF;--tx:#FFFFFF;--mu:#B9B2C8;--ln:#2d2145;--ok:#3ddc97;--wr:#ffb454;--er:#ff5d7a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
#app{display:flex;min-height:100vh}
nav{width:218px;background:var(--pn);border-right:1px solid var(--ln);padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto;flex:none}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;font-weight:700;letter-spacing:.04em}
.brand img{width:34px;height:34px;object-fit:contain}.brand .lg{width:34px;height:34px;border:1px dashed var(--pu);border-radius:10px;display:grid;place-items:center;color:var(--mg);font-size:11px}
nav a{display:block;padding:9px 12px;border-radius:10px;color:var(--mu);cursor:pointer;margin-bottom:2px}
nav a:hover{background:var(--pn2);color:var(--tx)}nav a.on{background:linear-gradient(90deg,rgba(160,32,240,.28),rgba(225,0,255,.08));color:var(--tx);box-shadow:inset 2px 0 var(--mg)}
main{flex:1;min-width:0;padding:22px 26px 60px;max-width:1280px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:15px;margin:0 0 12px}.sub{color:var(--mu);margin-bottom:18px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:16px;padding:16px;min-width:0}
.k{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.07em}.v{font-size:24px;font-weight:700;margin-top:4px}
.btn{background:linear-gradient(135deg,var(--pu),var(--mg));color:#fff;border:0;border-radius:10px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.s{background:var(--pn2);border:1px solid var(--ln);color:var(--tx)}.btn.d{background:transparent;border:1px solid var(--er);color:var(--er)}.btn.t{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{width:100%;background:#0f0a1a;border:1px solid var(--ln);border-radius:10px;color:var(--tx);padding:8px 10px;font:inherit}
input:focus,select:focus,textarea:focus{outline:1px solid var(--pu)}label{display:block;color:var(--mu);font-size:12px;margin:0 0 4px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.f>div.w{grid-column:1/-1}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th{color:var(--mu);font-weight:500;text-align:left;font-size:12px}
th,td{padding:8px 8px;border-bottom:1px solid var(--ln);white-space:nowrap}td.r,th.r{text-align:right}
.tag{padding:2px 9px;border-radius:99px;font-size:12px;background:var(--pn2);border:1px solid var(--ln)}
.tag.accepted,.tag.completed,.tag.active{color:var(--ok)}.tag.declined,.tag.overdue{color:var(--er)}.tag.sent,.tag.in-progress{color:var(--wr)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.bar input,.bar select{width:auto;min-width:150px}
.demo{background:rgba(160,32,240,.12);border:1px solid var(--pu);border-radius:12px;padding:8px 12px;color:var(--mu);margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.badge{font-size:12px;color:var(--mu)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--wr);margin-right:6px}.dot.on{background:var(--ok)}
.res{font-size:30px;font-weight:800;background:linear-gradient(90deg,var(--pu),var(--mg));-webkit-background-clip:text;background-clip:text;color:transparent}
.row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--ln)}
#mod{position:fixed;inset:0;background:rgba(8,5,15,.8);display:none;place-items:center;z-index:50;padding:16px}
#mod .card{width:100%;max-width:640px;max-height:90vh;overflow:auto;background:var(--pn)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal div{background:var(--pn2);border-radius:8px;min-height:74px;padding:4px;font-size:11px;overflow:hidden}.cal .h{min-height:0;background:none;color:var(--mu);text-align:center}
.cal .j{background:var(--pu);border-radius:5px;padding:1px 4px;margin-top:2px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chk{display:flex;gap:8px;align-items:center;margin:4px 0}.chk input{width:auto}
#tb{display:none}
@media(max-width:760px){#app{flex-direction:column}nav{width:100%;height:auto;position:static;display:flex;overflow-x:auto;padding:8px;gap:2px}nav .brand{display:none}nav a{white-space:nowrap;margin:0}main{padding:16px 14px 50px}#tb{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--pn);font-weight:700}}

button.nv{display:block;width:100%;text-align:left;background:none;border:0;font:inherit;padding:9px 12px;border-radius:10px;color:var(--mu);cursor:pointer;margin-bottom:2px}button.nv:hover{background:var(--pn2);color:var(--tx)}button.nv.on{background:linear-gradient(90deg,rgba(160,32,240,.28),rgba(225,0,255,.08));color:var(--tx);box-shadow:inset 2px 0 var(--mg)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.ap:focus-visible{outline:2px solid var(--mg);outline-offset:2px}
.err{color:var(--er);margin-top:8px;min-height:18px}.tag.approved,.tag.published{color:var(--ok)}.tag.review{color:var(--wr)}.tag.changes{color:var(--er)}
.wk{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.ap{background:var(--pu);border-radius:6px;padding:2px 6px;margin-top:3px;cursor:pointer;font-size:11px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.ap.approved,.ap.published{background:#1f6b4d}.ap.review{background:#8a5a10}.ap.changes{background:#8a2a3d}
.pg{height:8px;background:var(--pn2);border-radius:5px;overflow:hidden}.pg i{display:block;height:100%;background:linear-gradient(90deg,#A020F0,#E100FF)}
.pill{cursor:pointer;margin:2px}.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;align-items:start}
@media(max-width:760px){button.nv{white-space:nowrap;width:auto}}</style></head><body>

function stTags(){const pl=st.pid?P(st.pid).pillar:'L',sc='#'+sch().replace(/[^A-Za-z0-9]/g,'');return[...new Set([sc,...TAGS[pl],...TAGS.base])].slice(0,10)}
function stCount(){const l={Facebook:'about 500 characters reads best',Instagram:'limit 2,200 characters',WhatsApp:'keep under about 700 characters'}[st.plat],n=$('#s_text').value.length;$('#s_cnt').textContent=n+' characters — '+l}
function stHeads(t){const s=sch();return[`${t}: what every parent should know`,`Why ${t.toLowerCase()} matters at ${s}`,`${t} – join us!`,`3 things to know about ${t.toLowerCase()}`,`This week at ${s}: ${t}`]}
function stBuild(){stRead();if(!st.topic.trim()){alert('Enter a topic first.');return}const s=sch(),t=st.topic.trim(),d=st.detail.trim(),c=st.cta||S.brand.ctas[0]||'',lead={warm:`At ${s}, we believe every child deserves to feel at home. `,professional:`${s} is committed to quality early learning. `,playful:`Little learners, big adventures! `,urgent:`Spaces are filling fast! `}[st.tone],tags=stTags();

else{const h=S.posts.flatMap(p=>(p.hist||[]).map(x=>({...x,n:p.topic}))).sort((a,b)=>b.d.localeCompare(a.d)).slice(0,60);b=`<div class="card tw"><table><tr><th>Date</th><th>Post</th><th>Change</th></tr>${h.map(x=>`<tr><td>${x.d}</td><td>${esc(x.n)}</td><td>${esc(x.t)}</td></tr>`).join('')||'<tr><td colspan=3 class="badge">No changes recorded yet</td></tr>'}</table></div>`}

function strat(){const pl=S.plan,mo=n=>new Date(S.school.start+'T12:00').getMonth()+n,mn=n=>new Date(2000,mo(n),1).toLocaleString('en-ZA',{month:'long'}),tx=(k,l,v,r=2)=>`<div class="w"><label for="p_${k}">${l}</label><textarea id="p_${k}" rows="${r}" ${cloud.admin?'':'disabled'} onchange="pSet('${k}',this.value)">${esc(v)}</textarea></div>`;

/* export */
function pdf(title){if(!window.jspdf){alert('PDF library failed to load.');return null}const d=new jspdf.jsPDF({unit:'mm',format:'a4'}),s=S.school,h=S.brand.c1||'#A020F0',rg=[1,3,5].map(k=>parseInt(h.slice(k,k+2),16)||0);d.setFillColor(8,5,15);d.rect(0,0,210,30,'F');d.setFillColor(...rg);d.rect(0,30,210,1.5,'F');if(logo){try{d.addImage(logo,'PNG',12,4,22,22)}catch(e){}}d.setTextColor(255);d.setFontSize(16);d.text(s.name||'School',logo?38:12,14);d.setFontSize(9);d.text([s.phone,s.email,s.web].filter(Boolean).join('  |  '),logo?38:12,21);d.setFontSize(14);d.text(title,198,14,{align:'right'});d.setTextColor(30);return{d,y:42}}

function pdfStrat(){const p=pdf('MARKETING STRATEGY');if(!p)return;const pl=S.plan,s=S.school;para(p,`${s.name} · ${s.type}${s.ages?' · ages '+s.ages:''}`,{b:1,s:12});para(p,'Target audience',{b:1,s:11});para(p,pl.audience||s.audience||'—');para(p,'Content pillars',{b:1,s:11});para(p,pl.pillars.join(' · '));para(p,'Campaign priorities',{b:1,s:11});para(p,pl.priorities.join(' · '));para(p,'Marketing goals',{b:1,s:11});para(p,s.goals||'—');para(p,'Brand voice',{b:1,s:11});para(p,S.brand.voice);for(let n=0;n<6;n++){para(p,`Month ${n+1}`,{b:1,s:11,g:0});para(p,'Objective: '+(pl.objs[n]||'—'));para(p,'Actions: '+(pl.months[n]||'—'))}dl('strategy.pdf',p.d.output('blob'),'application/pdf')}
function pdfCal(){if(!S.posts.length)return alert('The calendar is empty.');const p=pdf('CONTENT CALENDAR');if(!p)return;[...S.posts].sort((a,b)=>a.date.localeCompare(b.date)).forEach(x=>para(p,`${x.date}  ·  ${x.platform}  ·  ${PIL[x.pillar]}  ·  ${ST[x.status]}\n${x.topic}`,{g:1}));dl('content-calendar.pdf',p.d.output('blob'),'application/pdf')}
function exp(){const c=(t,d,f,b='Download')=>`<div class="card"><h2>${t}</h2><p class="sub">${d}</p><button class="btn" onclick="${f}">${b}</button></div>`;return head('Export Centre','Files are generated in your browser and saved only if you confirm.')+`<div class="grid g2">${c('Content schedule (CSV)','All posts with dates, status and captions.',`dl('content-schedule.csv',csv([['Date','Week','Platform','Pillar','Topic','Status','Caption'],...S.posts.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(p=>[p.date,p.week,p.platform,PIL[p.pillar],p.topic,ST[p.status],p.caption])]),'text/csv')`)}${c('Content calendar (PDF)','Branded calendar list.','pdfCal()')}${c('Captions (text)','All written captions.',`dl('captions.txt',S.posts.filter(p=>p.caption.trim()).map(p=>p.date+' · '+p.platform+' · '+p.topic+'\\n'+p.caption).join('\\n\\n----\\n\\n')||'No captions yet.')`)}${c('Campaign plans (text)','Objectives, dates and checklists.',`dl('campaign-plans.txt',S.camps.map(c=>c.name+' ['+c.type+'] '+c.start+' → '+c.end+'\\nObjective: '+c.obj+'\\n'+c.tasks.map(t=>(t.d?'[x] ':'[ ] ')+t.t).join('\\n')).join('\\n\\n')||'No campaigns yet.')`)}${c('Strategy (PDF)','Six-month branded strategy.','pdfStrat()')}${c('Full backup (JSON)','Everything in this workspace.',`dl('nexora-education-backup.json',JSON.stringify(S),'application/json')`)}</div>`}
function team(){return head('Team Workspace','Sharing, roles and data.')+`<div class="grid g2"><div class="card"><h2>Shared workspace</h2><div class="row"><span>Shared database</span><b>${cloud.on?'Connected':'Not available here'}</b></div><div class="row"><span>Your role</span><b>${cloud.on?(cloud.admin?'Administrator (approves content)':'Marketing team member'):'Single user'}</b></div><p>${cloud.on?'Everyone you share this page with in claude.ai works on the same calendar, library and approvals.':'Data is stored only in this browser. Open the published page signed in to claude.ai to use shared storage.'}</p><p class="badge">Sign-in is provided by claude.ai (no separate logins here). Team members can write and submit content for review; only the administrator (owner/editor) can approve, reject, mark published, delete, or edit setup, brand and strategy. These checks hide actions in the page and are not a hard security boundary. Per-user permission levels and email notifications would need a custom backend.</p><span id="who" class="badge"></span></div><div class="card"><h2>Data</h2><div class="bar"><input type="file" accept=".json" aria-label="Import backup" onchange="imp(this)"><button class="btn d" onclick="reset()">Erase all data</button></div></div></div>`}
function imp(el){const f=el.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(!o.posts||!o.school)throw 0;S=o;save();nav();draw()}catch(e){alert('Not a valid Nexora Education backup.')}})}
function reset(){if(can()&&confirm('Erase ALL data and restart setup? This cannot be undone.')){S=blank();save();nav();draw()}}
function keep(){const p=document.activeElement.selectionStart;draw();const i=document.querySelector('.bar input');if(i){i.focus();i.setSelectionRange(p,p)}}
try{cw=Math.max(0,Math.floor((new Date(iso(today)+'T12:00')-new Date(S.school.start+'T12:00'))/6048e5))||0}catch(e){}
nav();draw();
(async()=>{if(!window.claude)return;try{const[db,user]=await Promise.all([claude.use('db'),claude.use('user')]);if(user){cloud.admin=user.canEdit()||user.isOwner();try{const me=await user.me();setTimeout(()=>{const w=$('#who');if(w&&me&&me.name)w.textContent='Signed in as '+me.name},0)}catch(e){}}
if(!db)return;cloud.ref=db.doc('nexora-education/state');cloud.on=true;let first=true;cloud.ref.onSnapshot(s=>{if(s.exists){const d=s.data();if(d.rev&&d.rev!==S.rev){try{S=JSON.parse(d.json);localStorage.setItem(LS,d.json);nav();if($('#mod').style.display!=='grid')draw()}catch(e){}}}else if(first&&cloud.admin&&S.done){push()}first=false;badge()},e=>{cloud.err=e.code||'error';badge()})}catch(e){}})();
</script></body></html>
